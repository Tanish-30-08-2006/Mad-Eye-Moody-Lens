# Same-origin proxy for the laptop demo (design doc Section 11).
#   /         built React app (dist/)
#   /api/...  FastAPI container, 105 MB body cap, request buffering off
# Internal routes (/api/v1/metrics, /docs, /openapi.json) are blocked here.

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 100 MB video limit + multipart overhead; the API enforces exact per-type limits.
    client_max_body_size 105m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    # Fonts from Google; heatmap tiles are data: URLs; media previews are blob: URLs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    location = /api/v1/metrics { return 404; }
    location = /docs { return 404; }
    location = /openapi.json { return 404; }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # rate limiter keys on an HMAC of this
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;                     # stream uploads straight to the API
        proxy_read_timeout 60s;                          # sync analyses wait <= 30 s
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
