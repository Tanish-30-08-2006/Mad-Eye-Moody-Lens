[alembic]
script_location = migrations
# Make `import app...` work from migrations/env.py (also inside the container's /app).
prepend_sys_path = .
# The URL comes from MML_DATABASE_URL (see migrations/env.py), never from this file.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stdout,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
