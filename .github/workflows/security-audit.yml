name: Security Audit

on:
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-python:
    name: Audit Python Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pip-audit on Backend
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          echo "### Python Dependency Audit Report" >> $GITHUB_STEP_SUMMARY
          set +e
          AUDIT_OUTPUT=$(pip-audit -r functional-ui-models-backend/backend/requirements.txt 2>&1)
          AUDIT_EXIT=$?
          set -e
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$AUDIT_OUTPUT" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          if [ $AUDIT_EXIT -ne 0 ]; then
            echo "::warning::pip-audit found potential vulnerabilities in Python dependencies. Check Step Summary."
          else
            echo "Python dependencies audit passed with 0 vulnerabilities."
          fi

  audit-node:
    name: Audit Node Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run npm audit on Frontend
        working-directory: functional-ui-models-backend/frontend
        run: |
          echo "### Node Dependency Audit Report" >> $GITHUB_STEP_SUMMARY
          set +e
          AUDIT_OUTPUT=$(npm audit --audit-level=high 2>&1)
          AUDIT_EXIT=$?
          set -e
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$AUDIT_OUTPUT" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          if [ $AUDIT_EXIT -ne 0 ]; then
            echo "::warning::npm audit found high severity vulnerabilities in Frontend dependencies. Check Step Summary."
          else
            echo "Frontend Node dependencies audit passed with 0 high/critical vulnerabilities."
          fi
