<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Solid Black Background -->
  <rect width="512" height="512" fill="#000000"/>
  
  <!-- Magnifying Glass Handle -->
  <polygon points="290,313 313,290 442,419 439,439 419,442" fill="#1e293b" stroke="#94a3b8" stroke-width="3" stroke-linejoin="round"/>
  <line x1="308" y1="308" x2="427" y2="427" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Handle Collar -->
  <polygon points="284,313 313,284 324,296 296,324" fill="#475569" stroke="#e2e8f0" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Magnifying Lens Outer Rim -->
  <circle cx="208" cy="208" r="138" fill="#0f172a" stroke="#94a3b8" stroke-width="8"/>
  <circle cx="208" cy="208" r="133" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
  
  <!-- Lens Inner Aperture Cavity -->
  <circle cx="208" cy="208" r="120" fill="#000000" stroke="#334155" stroke-width="2"/>
  
  <!-- Forensic Alignment Cardinal Ticks -->
  <line x1="208" y1="88" x2="208" y2="100" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="208" y1="316" x2="208" y2="328" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="88" y1="208" x2="100" y2="208" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="316" y1="208" x2="328" y2="208" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Neural Eye Contour -->
  <path d="M 103 208 Q 208 133 313 208 Q 208 283 103 208 Z" fill="none" stroke="#e2e8f0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Iris Ring -->
  <circle cx="208" cy="208" r="44" fill="none" stroke="#64748b" stroke-width="2.5"/>
  
  <!-- Synaptic Edges: Radial to Iris -->
  <line x1="208" y1="208" x2="252" y2="208" stroke="#94a3b8" stroke-width="2"/>
  <line x1="208" y1="208" x2="164" y2="208" stroke="#94a3b8" stroke-width="2"/>
  <line x1="208" y1="208" x2="230" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <line x1="208" y1="208" x2="186" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <line x1="208" y1="208" x2="186" y2="246" stroke="#94a3b8" stroke-width="2"/>
  <line x1="208" y1="208" x2="230" y2="246" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Synaptic Edges: Iris to Eye Contour -->
  <line x1="164" y1="208" x2="103" y2="208" stroke="#94a3b8" stroke-width="2"/>
  <line x1="252" y1="208" x2="313" y2="208" stroke="#94a3b8" stroke-width="2"/>
  <line x1="186" y1="170" x2="155.5" y2="178.6" stroke="#94a3b8" stroke-width="2"/>
  <line x1="186" y1="170" x2="208" y2="170.5" stroke="#94a3b8" stroke-width="2"/>
  <line x1="230" y1="170" x2="208" y2="170.5" stroke="#94a3b8" stroke-width="2"/>
  <line x1="230" y1="170" x2="260.5" y2="178.6" stroke="#94a3b8" stroke-width="2"/>
  <line x1="186" y1="246" x2="155.5" y2="237.4" stroke="#94a3b8" stroke-width="2"/>
  <line x1="186" y1="246" x2="208" y2="245.5" stroke="#94a3b8" stroke-width="2"/>
  <line x1="230" y1="246" x2="208" y2="245.5" stroke="#94a3b8" stroke-width="2"/>
  <line x1="230" y1="246" x2="260.5" y2="237.4" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Cross Synaptic Chords -->
  <line x1="103" y1="208" x2="155.5" y2="178.6" stroke="#64748b" stroke-width="1.5"/>
  <line x1="103" y1="208" x2="155.5" y2="237.4" stroke="#64748b" stroke-width="1.5"/>
  <line x1="313" y1="208" x2="260.5" y2="178.6" stroke="#64748b" stroke-width="1.5"/>
  <line x1="313" y1="208" x2="260.5" y2="237.4" stroke="#64748b" stroke-width="1.5"/>
  
  <!-- Iris Vertices (Nodes) -->
  <circle cx="252" cy="208" r="4.5" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="164" cy="208" r="4.5" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="230" cy="170" r="4.5" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="186" cy="170" r="4.5" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="186" cy="246" r="4.5" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="230" cy="246" r="4.5" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Contour Vertices (Nodes) -->
  <circle cx="103" cy="208" r="4.5" fill="#f8fafc"/>
  <circle cx="313" cy="208" r="4.5" fill="#f8fafc"/>
  <circle cx="155.5" cy="178.6" r="4" fill="#f8fafc"/>
  <circle cx="208" cy="170.5" r="4.5" fill="#f8fafc"/>
  <circle cx="260.5" cy="178.6" r="4" fill="#f8fafc"/>
  <circle cx="155.5" cy="237.4" r="4" fill="#f8fafc"/>
  <circle cx="208" cy="245.5" r="4.5" fill="#f8fafc"/>
  <circle cx="260.5" cy="237.4" r="4" fill="#f8fafc"/>
  
  <!-- Pupil / Central Neural Core -->
  <circle cx="208" cy="208" r="16" fill="#0f172a" stroke="#f8fafc" stroke-width="3"/>
  <circle cx="208" cy="208" r="8" fill="#ffffff"/>
</svg>
