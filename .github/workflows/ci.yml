name: CI - Code Quality & Automated Tests

on:
  push:
    branches: [main, tanish-dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Tests, Lint & Parity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functional-ui-models-backend/backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: functional-ui-models-backend/backend/requirements.txt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libglib2.0-0 libgomp1

      - name: Install PyTorch (CPU)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt -r requirements-dev.txt

      - name: Lint Code (Ruff)
        run: ruff check app tests scripts

      - name: Type Check (Mypy)
        run: mypy app --ignore-missing-imports --disable-error-code=attr-defined --disable-error-code=list-item --disable-error-code=assignment

      - name: Verify Backend / Frontend Contract Parity
        run: python -m scripts.check_parity ../frontend

      - name: Run Test Suite (Pytest)
        run: pytest -v

  frontend-ci:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functional-ui-models-backend/frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functional-ui-models-backend/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Vite Production Bundle
        run: npm run build

  extension-ci:
    name: Browser Extension Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Extension Service Worker Tests
        run: |
          node --test browser-extension/backend/tests/background.test.mjs
          node --test Browser_Extension/backend/tests/background.test.mjs

  telegram-bot-ci:
    name: Telegram Bot Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-bot
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: telegram-bot/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Bot Unit Tests
        run: pytest tests/test_units.py -v

  docker-build-verify:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Production Docker Image Build
        run: docker build -t madeye-moody-backend:ci .
